name: Apple VF live E2E

# GitHub's hosted macOS runners cannot boot Apple VF microVMs and no applevf
# self-hosted runner is attached today, so live mac coverage runs manually on
# Apple-silicon hardware. Release tags therefore do not queue the self-hosted
# job; instead the attestation job below requires that a manual run was
# recorded for the tagged commit (scripts/dev/applevf-live-attest.sh posts an
# `applevf-live` commit status after the targeted suite passes). The
# self-hosted lane remains reachable via workflow_dispatch and the
# run-applevf-live PR label for the day a runner is attached.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  # Release-tag path: hosted runners cannot produce this evidence, so require
  # the recorded manual run instead of silently shipping without one.
  attestation:
    name: Require attested Apple VF live run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check for an applevf-live status on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '[.statuses[] | select(.context == "applevf-live")][0].state // "missing"')
          if [ "$state" = "success" ]; then
            echo "applevf-live attestation found for ${{ github.sha }}."
            exit 0
          fi
          echo "::error::No successful applevf-live attestation on ${{ github.sha }} (found: $state). Run scripts/dev/applevf-live-attest.sh at this commit on an Apple-silicon host, then re-run this workflow."
          exit 1

  # No applevf self-hosted runner is attached today, so the targeted job would
  # sit queued for GitHub's 24h ceiling (timeout-minutes only starts counting
  # once a runner picks the job up — it never bounds queue time). This
  # watchdog cancels the run when the mac job is still queued after a short
  # grace period. When a runner is attached some day, extend or drop the
  # grace period so a merely-busy runner is not mistaken for an absent one.
  queue-watchdog:
    name: Cancel when no applevf runner is online
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'run-applevf-live')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Cancel the run if the targeted job is still queued after 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          status=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name | startswith("Apple VF targeted")) | .status')
          if [ "$status" = "queued" ]; then
            echo "No applevf self-hosted runner picked the job up within the grace period; cancelling the run."
            gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
          else
            echo "Targeted job status: ${status:-not found}; leaving the run alone."
          fi

  targeted:
    name: Apple VF targeted live E2E
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'run-applevf-live')
    runs-on: [self-hosted, macOS, ARM64, applevf]
    timeout-minutes: 45
    env:
      MICROAGENT_E2E_BACKEND: apple-vf
      MICROAGENT_E2E_WAIT_TIMEOUT: "180"
      # A live lane that cannot boot microVMs is misconfigured; fail instead
      # of reporting an all-skip run as suite OK.
      MICROAGENT_E2E_REQUIRE_VM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod

      - name: Build signed Apple VF supervisor
        run: scripts/dev/applevf-supervisor-build.sh

      - name: Run targeted Apple VF E2E
        run: scripts/dev/microagent-e2e.sh mcp-lifecycle networking-deep public-surface applevf-direct-console applevf-snapshot
