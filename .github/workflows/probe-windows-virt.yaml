name: Probe Windows hosted Hyper-V

on:
  push:
    branches:
      - probe-windows-hyperv

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-latest]
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: go.mod

      - name: Host virtualization facts
        shell: pwsh
        run: |
          systeminfo | Select-String -Pattern "Hyper-V"
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V* | Format-Table FeatureName, State
          Get-Service vmms, vmcompute -ErrorAction SilentlyContinue | Format-Table Name, Status
          Get-CimInstance Win32_ComputerSystem | Select-Object HypervisorPresent

      - name: Build microagent
        run: |
          go build -o microagent.exe ./cmd/microagent
          go build -o microagent-guestinit-amd64 ./cmd/microagent-guestinit

      - name: Doctor (full JSON)
        shell: pwsh
        run: |
          ./microagent.exe --json doctor
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor exit: $LASTEXITCODE" }
          exit 0
