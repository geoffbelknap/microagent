name: Live Windows Hyper-V

on:
  workflow_dispatch:
    inputs:
      kernel-path:
        description: Windows path to the Hyper-V Linux kernel Image
        required: true
        default: C:\Users\runneradmin\.microagent\kernels\windows-hyperv\amd64\Image
      image:
        description: OCI image used by smoke tests
        required: false
        default: docker.io/library/busybox:1.36

permissions:
  contents: read

jobs:
  windows-hyperv-parity:
    name: Windows Hyper-V parity
    runs-on:
      - self-hosted
      - windows
      - x64
      - hyperv
    timeout-minutes: 45
    env:
      MICROAGENT_WINDOWS_HYPERV_KERNEL: ${{ inputs.kernel-path }}
      MICROAGENT_WINDOWS_HYPERV_IMAGE: ${{ inputs.image }}
      MICROAGENT_WINDOWS_HYPERV_GUESTINIT: ${{ github.workspace }}\.build\libexec\microagent-guestinit-amd64
      MICROAGENT_WINDOWS_HYPERV_STATE_DIR: ${{ runner.temp }}\microagent-windows-hyperv
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.mod

      - name: Build microagent binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build\bin | Out-Null
          New-Item -ItemType Directory -Force .build\libexec | Out-Null
          go build -o .build\bin\microagent.exe ./cmd/microagent
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -o $env:MICROAGENT_WINDOWS_HYPERV_GUESTINIT ./cmd/microagent-guestinit

      - name: Host doctor
        shell: pwsh
        run: .build\bin\microagent.exe --json doctor --backend windows-hyperv

      - name: Windows-HyperV run result smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_SMOKE: "1"
        run: go test ./pkg/workspace -run TestWindowsHyperVSmokeRunResult -count=1 -timeout 5m -v

      - name: Windows-HyperV connect smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_SMOKE: "1"
        run: go test ./cmd/microagent -run TestWindowsHyperVConnectSmoke -count=1 -timeout 6m -v

      - name: Windows-HyperV mediation smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_MEDIATION_SMOKE: "1"
        run: go test ./cmd/microagent -run TestWindowsHyperVMediationSmoke -count=1 -timeout 8m -v
