name: Live Windows Hyper-V

on:
  workflow_dispatch:
    inputs:
      image:
        description: OCI image used by smoke tests
        required: false
        default: docker.io/library/busybox:1.36
  schedule:
    # Nightly smoke against main (06:47 UTC), offset from live-linux-parity.
    - cron: "47 6 * * *"
  # windows-hyperv is an experimental backend (see backends.md), so it
  # does not gate releases. Run it nightly and on demand, never on release tags.

permissions:
  contents: read

concurrency:
  group: live-windows-hyperv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-hyperv-parity:
    name: Windows Hyper-V parity (${{ matrix.shard.name }})
    # GitHub-hosted Windows runners ship with the Hyper-V role active and the
    # HCS services (vmms/vmcompute) running. The scenario suite is sharded
    # across parallel runners — each shard is a fresh runner with its own HCS,
    # so there is no cross-shard VM contention and the lane's wall time is the
    # slowest shard rather than the sum of every scenario. The four Go smokes
    # that used to run inline are intentionally absent: the windows-hyperv-*-host
    # probes run the identical TestWindowsHyperV* tests, so they are covered in
    # the host-probes shard.
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: portable
            scenarios: >-
              coverage-matrix contract help-usage mcp-stdio registry-auth
              text-output init public-surface transport-deep survive-reboot
              exec-stream
          - name: lifecycle
            scenarios: lifecycle-deep volumes commit-images
          - name: networking
            # networking-deep is isolated: it is the scenario most exposed to
            # the residual HCS teardown-timing flake on degraded runners, and a
            # leaked VM there would otherwise cascade into a neighbour's kernel
            # swap. Alone, a flake re-runs just this ~8-min shard.
            scenarios: networking-deep
          - name: services
            scenarios: secrets mcp-lifecycle health supervision-deep
          - name: host-probes
            scenarios: >-
              windows-hyperv-lifecycle-host windows-hyperv-connect-host
              windows-hyperv-exec-host windows-hyperv-transport-host
              windows-hyperv-model-host
    env:
      MICROAGENT_WINDOWS_HYPERV_IMAGE: ${{ inputs.image || 'docker.io/library/busybox:1.36' }}
      MICROAGENT_WINDOWS_HYPERV_GUESTINIT: ${{ github.workspace }}\.build\libexec\microagent-guestinit-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.mod

      - name: Set state dir
        shell: pwsh
        # runner.temp is not available in job-level env; export from a step.
        run: |
          "MICROAGENT_WINDOWS_HYPERV_STATE_DIR=$env:RUNNER_TEMP\microagent-windows-hyperv" | Out-File -Append $env:GITHUB_ENV
          "MICROAGENT_WINDOWS_HYPERV_KERNEL=$env:USERPROFILE\.microagent\kernels\windows-hyperv\amd64\Image" | Out-File -Append $env:GITHUB_ENV

      - name: Build microagent binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build\bin | Out-Null
          New-Item -ItemType Directory -Force .build\libexec | Out-Null
          New-Item -ItemType Directory -Force .build\kernel | Out-Null
          go build -o .build\bin\microagent.exe ./cmd/microagent
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -o $env:MICROAGENT_WINDOWS_HYPERV_GUESTINIT ./cmd/microagent-guestinit

      - name: Install guest kernel
        shell: pwsh
        run: .build\bin\microagent.exe kernel install

      - name: Host doctor
        shell: pwsh
        run: .build\bin\microagent.exe --json doctor --backend windows-hyperv

      - name: Windows E2E shard (Git Bash)
        # The unified runner under Git Bash runs this shard's scenarios. Hosted
        # Windows runners ship Git Bash.
        shell: bash
        run: scripts/dev/microagent-e2e.sh ${{ matrix.shard.scenarios }}
