name: Live Windows Hyper-V

on:
  workflow_dispatch:
    inputs:
      image:
        description: OCI image used by smoke tests
        required: false
        default: docker.io/library/busybox:1.36
  schedule:
    # Nightly smoke against main (06:47 UTC), offset from live-linux-parity.
    - cron: "47 6 * * *"
  push:
    # Always gate release candidates and releases.
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: live-windows-hyperv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-hyperv-parity:
    name: Windows Hyper-V parity
    # GitHub-hosted Windows runners ship with the Hyper-V role active and the
    # HCS services (vmms/vmcompute) running.
    runs-on: windows-latest
    # lifecycle-deep adds several full VHD boots to the lane; headroom over
    # the observed runtime keeps slow hosted runners from flaking the job.
    timeout-minutes: 60
    env:
      MICROAGENT_WINDOWS_HYPERV_IMAGE: ${{ inputs.image || 'docker.io/library/busybox:1.36' }}
      MICROAGENT_WINDOWS_HYPERV_GUESTINIT: ${{ github.workspace }}\.build\libexec\microagent-guestinit-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: go.mod

      - name: Set state dir
        shell: pwsh
        # runner.temp is not available in job-level env; export from a step.
        run: |
          "MICROAGENT_WINDOWS_HYPERV_STATE_DIR=$env:RUNNER_TEMP\microagent-windows-hyperv" | Out-File -Append $env:GITHUB_ENV
          "MICROAGENT_WINDOWS_HYPERV_KERNEL=$env:USERPROFILE\.microagent\kernels\windows-hyperv\amd64\Image" | Out-File -Append $env:GITHUB_ENV

      - name: Build microagent binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build\bin | Out-Null
          New-Item -ItemType Directory -Force .build\libexec | Out-Null
          New-Item -ItemType Directory -Force .build\kernel | Out-Null
          go build -o .build\bin\microagent.exe ./cmd/microagent
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -o $env:MICROAGENT_WINDOWS_HYPERV_GUESTINIT ./cmd/microagent-guestinit

      - name: Install guest kernel
        shell: pwsh
        run: .build\bin\microagent.exe kernel install

      - name: Host doctor
        shell: pwsh
        run: .build\bin\microagent.exe --json doctor --backend windows-hyperv

      - name: Windows-HyperV run result smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_SMOKE: "1"
        run: go test ./pkg/workspace -run TestWindowsHyperVSmokeRunResult -count=1 -timeout 5m -v

      - name: Windows-HyperV connect smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_SMOKE: "1"
        run: go test ./cmd/microagent -run TestWindowsHyperVConnectSmoke -count=1 -timeout 6m -v

      - name: Windows-HyperV structured exec smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_SMOKE: "1"
        run: go test ./cmd/microagent -run TestWindowsHyperVExecSmoke -count=1 -timeout 8m -v

      - name: Windows-HyperV mediation smoke
        shell: pwsh
        env:
          MICROAGENT_WINDOWS_HYPERV_MEDIATION_SMOKE: "1"
        run: go test ./cmd/microagent -run TestWindowsHyperVMediationSmoke -count=1 -timeout 8m -v

      - name: Windows E2E lane (Git Bash)
        # The unified runner under Git Bash: portable scenarios plus the
        # windows-hyperv host probes. Hosted Windows runners ship Git Bash.
        shell: bash
        run: >-
          scripts/dev/microagent-e2e.sh
          coverage-matrix contract help-usage mcp-stdio registry-auth
          text-output init public-surface lifecycle-deep networking-deep
          transport-deep secrets commit-images
          windows-hyperv-lifecycle-host windows-hyperv-connect-host
          windows-hyperv-exec-host windows-hyperv-transport-host
          windows-hyperv-model-host
