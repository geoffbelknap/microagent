name: Debug perf ready

# TEMPORARY diagnostic workflow — exists only on this debug branch, never
# merged. Round 2 pinned the nightly public-surface failure to
# `perf ready --start paused-resume --probe exec`: setup
# (create/start/exec/pause) succeeds in ~856ms, the warm-up resume returns
# in 6ms, and the post-resume structured-exec wait then burns 33s of
# connection resets. perf tears the iteration workspace down, so no guest
# serial log survives. Round 3 hand-rolls that exact sequence with full log
# capture, in a "quick" variant matching perf's cadence and a "settled"
# variant with sleeps, to catch the guest in the broken state.

on:
  pull_request:

permissions:
  contents: read

jobs:
  repro:
    name: pause/resume exec repro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup microagent KVM environment
        uses: ./.github/actions/setup-microagent-kvm

      - name: Hand-rolled pause/resume exec sequence
        run: |
          set -x
          CLI=.build/dev/microagent
          IMAGE="docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"
          OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT"
          "$CLI" kernel install --backend linux-kvm --arch x86_64
          for variant in quick settled; do
            SD="/tmp/dbg-$variant"
            ws="w1"
            mkdir -p "$SD"
            echo "==== variant $variant ===="
            "$CLI" --json create "$ws" --image "$IMAGE" --profile tiny --entrypoint "sleep 600" --state-dir "$SD" >"$OUT/$variant-create.json" || true
            "$CLI" --json start "$ws" --state-dir "$SD" >"$OUT/$variant-start.json" || true
            "$CLI" --json exec "$ws" --state-dir "$SD" -- /bin/true >"$OUT/$variant-exec-before.json" 2>&1 || true
            if [ "$variant" = "settled" ]; then sleep 3; fi
            "$CLI" --json pause "$ws" --reason debug --state-dir "$SD" >"$OUT/$variant-pause.json" || true
            if [ "$variant" = "settled" ]; then sleep 2; fi
            "$CLI" --json resume "$ws" --reason debug --state-dir "$SD" >"$OUT/$variant-resume.json" || true
            for i in 1 2 3; do
              status=0
              timeout 40 "$CLI" --json exec "$ws" --state-dir "$SD" -- /bin/true >"$OUT/$variant-exec-after-$i.json" 2>&1 || status=$?
              echo "variant=$variant exec-after-$i exit=$status"
              [ "$status" -ne 0 ] && sleep 3
            done
            "$CLI" --json status "$ws" --state-dir "$SD" >"$OUT/$variant-status.json" || true
            # Grab every log before teardown; the guest serial log is the prize.
            find "$SD" -type f \( -name '*.log' -o -name '*.json' \) -size -2M \
              -exec cp --parents {} "$OUT/" \; 2>/dev/null || true
            "$CLI" kill "$ws" --state-dir "$SD" --reason debug --yes >/dev/null 2>&1 || true
            "$CLI" delete "$ws" --force --yes --state-dir "$SD" >/dev/null 2>&1 || true
          done
          dmesg 2>/dev/null | tail -50 > "$OUT/host-dmesg-tail.txt" || true
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pause-resume-exec-debug
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
