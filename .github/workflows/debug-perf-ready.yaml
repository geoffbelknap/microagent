name: Debug perf ready

# TEMPORARY diagnostic workflow — exists only on this debug branch, never
# merged. The nightly public-surface E2E fails on the KVM runners inside
# `perf ready --start cold --probe interactive`: the structured-exec
# readiness gate dies with "connection reset by peer" mid-response, while
# the same command passes on Apple-silicon hosts. Round 1 ran the command
# standalone in a variant matrix; those failures turned out to be unix
# socket path-length artifacts of the long debug state-dir names (the
# vsock.sock_1024 path crossed sun_path's 108-byte limit), not the nightly
# bug. Round 2 runs the real public-surface scenario with kept state and
# uploads its reports and guest serial logs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  repro:
    name: public-surface with kept state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MICROAGENT_E2E_WAIT_TIMEOUT: "180"
      MICROAGENT_E2E_KEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup microagent KVM environment
        uses: ./.github/actions/setup-microagent-kvm

      - name: Run public-surface
        run: |
          status=0
          scripts/dev/microagent-e2e.sh public-surface || status=$?
          echo "public-surface exit=$status"
          mkdir -p "$RUNNER_TEMP/evidence"
          for d in /tmp/microagent-public-surface.*; do
            [ -d "$d" ] || continue
            find "$d" -type f \( -name '*.json' -o -name '*.log' -o -name '*.txt' \) -size -2M \
              -exec cp --parents {} "$RUNNER_TEMP/evidence/" \; 2>/dev/null || true
          done
          # Informational job: the artifacts carry the evidence either way.
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-surface-kept-state
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
