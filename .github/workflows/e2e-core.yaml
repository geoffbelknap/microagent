name: E2E core

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  matrix-core:
    name: Generate core scenario matrix
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.gen.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate scenario list
        id: gen
        run: |
          echo "scenarios=$(scripts/dev/microagent-e2e.sh --list-tier core | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  core:
    name: core / ${{ matrix.scenario }}
    needs: matrix-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.matrix-core.outputs.scenarios) }}
    env:
      MICROAGENT_E2E_WAIT_TIMEOUT: "180"
      # This job exists to boot real microVMs: a scenario that skips for a
      # missing VM backend must fail the job, not read as suite OK.
      MICROAGENT_E2E_REQUIRE_VM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup microagent KVM environment
        uses: ./.github/actions/setup-microagent-kvm

      - name: Run ${{ matrix.scenario }} (1 retry)
        env:
          SCENARIO: ${{ matrix.scenario }}
          MICROAGENT_E2E_ATTEMPT_DIR: ${{ runner.temp }}/microagent-e2e-attempts
        run: scripts/dev/run-e2e-with-retry.sh "$SCENARIO"

      - name: Upload first-attempt failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-retry-${{ matrix.scenario }}
          path: ${{ runner.temp }}/microagent-e2e-attempts
          if-no-files-found: ignore

  e2e-core:
    name: E2E core (gate)
    needs: core
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: '[ "${{ needs.core.result }}" = "success" ] || exit 1'
