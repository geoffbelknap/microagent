name: update homebrew tap

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: microagent release tag, for example v0.8.0
        required: true

permissions:
  contents: read

jobs:
  update-formula:
    # Only stable product releases ship to the tap. Kernel artifact releases and
    # release candidates are validated by their own paths and must not rewrite
    # the microagent formula.
    if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'v') && !contains(inputs.tag || github.event.release.tag_name, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      # Same Homebrew GitHub App as the agency repo. Fails loudly when the
      # app credentials are missing — a silent skip here previously let
      # releases ship without the tap ever updating.
      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      # The update tooling comes from main; the caveat text comes from the
      # released tag, so a formula's install-time text always matches the
      # released behavior (see packaging/homebrew/README.md). Tags that predate
      # packaging/homebrew/ leave the caveats untouched.
      - name: Checkout microagent (tooling, from main)
        uses: actions/checkout@v7
        with:
          path: microagent

      - name: Checkout microagent (caveats, at the release tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          path: microagent-tag

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Set up git
        working-directory: homebrew-tap
        run: |
          git config user.name "microagent-release[bot]"
          git config user.email "microagent-release[bot]@users.noreply.github.com"

      - name: Bump formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          revision="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          python3 microagent/scripts/dev/update-tap-formula.py \
            --formula homebrew-tap/microagent.rb \
            --version "$version" \
            --revision "$revision" \
            --caveats microagent-tag/packaging/homebrew/microagent.caveats
          cd homebrew-tap
          git add microagent.rb
          if git diff --cached --quiet; then
            echo "formula already pins ${TAG}; nothing to push"
          else
            git commit -m "microagent: update microagent to ${TAG}"
            git push
          fi
