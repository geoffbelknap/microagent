name: update homebrew tap

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, or full commit SHA for the latest channel
        required: true
      platform:
        description: Platform to promote
        type: choice
        options: [linux, macos]
        default: linux
      channel:
        description: Formula channel
        type: choice
        options: [stable, latest]
        default: stable

permissions:
  contents: read

concurrency:
  group: microagent-tap-promotion
  cancel-in-progress: false

jobs:
  update-formula:
    # Published releases advance Linux only. macOS advances by explicit dispatch
    # after qualification of the selected commit on an Apple-silicon host.
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      # Same Homebrew GitHub App as the agency repo. Fails loudly when the
      # app credentials are missing — a silent skip here previously let
      # releases ship without the tap ever updating.
      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      # Promotion tooling comes from main; source pins and caveats select the
      # requested candidate without executing its code on this runner.
      - name: Checkout microagent (tooling, from main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          path: microagent

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Set up git
        working-directory: homebrew-tap
        run: |
          git config user.name "microagent-release[bot]"
          git config user.email "microagent-release[bot]@users.noreply.github.com"

      - name: Prepare platform promotion
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.tag || github.event.release.tag_name }}
          PLATFORM: ${{ inputs.platform || 'linux' }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          python3 microagent/scripts/dev/promote-tap.py \
            --source microagent --tap homebrew-tap \
            --ref "$CANDIDATE" --platform "$PLATFORM" --channel "$CHANNEL"

      - name: Publish formula update
        working-directory: homebrew-tap
        env:
          PLATFORM: ${{ inputs.platform || 'linux' }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          git add microagent.rb microagent-latest.rb
          if git diff --cached --quiet; then
            echo "Selected platform already uses this candidate."
          else
            git commit -m "microagent: promote ${CHANNEL} on ${PLATFORM}"
            git push
          fi
