name: Live Linux Parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microagent-parity:
    name: Full microagent E2E on Linux KVM
    runs-on:
      - self-hosted
      - linux
      - x64
      - kvm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.mod

      - name: Host facts
        run: scripts/dev/linux-host-facts.sh

      - name: Go tests
        run: scripts/dev/go-test.sh

      - name: Full microagent E2E suite
        run: scripts/dev/microagent-e2e.sh
