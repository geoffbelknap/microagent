name: Live Linux Parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firecracker-parity:
    name: Firecracker parity
    runs-on:
      - self-hosted
      - linux
      - x64
      - kvm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.mod

      - name: Host facts
        run: scripts/linux-host-facts.sh

      - name: Go tests
        run: scripts/go-test.sh

      - name: Firecracker console parity
        run: scripts/firecracker-console-parity-smoke.sh

      - name: Firecracker publish parity
        run: scripts/firecracker-publish-smoke.sh

      - name: Firecracker network modes
        run: scripts/firecracker-network-mode-smoke.sh

      - name: Firecracker workspace lifecycle
        run: scripts/firecracker-workspace-smoke.sh

      - name: Firecracker boot
        run: scripts/firecracker-boot-smoke.sh
