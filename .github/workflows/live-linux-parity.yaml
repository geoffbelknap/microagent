name: Live Linux parity

on:
  workflow_dispatch:
    inputs:
      image-cache-policy:
        description: Persistent E2E image cache policy
        required: false
        type: choice
        options:
          - auto
          - refresh
          - require
        default: auto
      image:
        description: OCI image override for public-surface scenarios
        required: false
        default: ""
  schedule:
    # Nightly regression run against main (06:17 UTC).
    - cron: "17 6 * * *"
  push:
    # Always gate release candidates and releases.
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: live-linux-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-kvm-full-suite:
    name: Linux KVM full microagent E2E
    # GitHub-hosted Linux x64 runners expose /dev/kvm (nested virtualization).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MICROAGENT_E2E_IMAGE_CACHE_POLICY: ${{ inputs.image-cache-policy || 'auto' }}
      MICROAGENT_E2E_IMAGE: ${{ inputs.image }}
      FIRECRACKER_VERSION: v1.16.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: go.mod

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
        # pasta needs them for firecracker user-mode networking.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Grant the runner user KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install firecracker
        run: |
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-x86_64.tgz" -o /tmp/firecracker.tgz
          tar -xzf /tmp/firecracker.tgz -C /tmp
          sudo install "/tmp/release-${FIRECRACKER_VERSION}-x86_64/firecracker-${FIRECRACKER_VERSION}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      - name: Inspect preserved test state
        run: scripts/dev/cleanup-temp.sh

      # Build the stack the way the E2E harness does, so doctor sees the
      # supervisor and the guest init next to the CLI binary.
      - name: Build microagent stack
        run: |
          mkdir -p .build/dev
          go build -buildvcs=false -o .build/dev/microagent ./cmd/microagent
          go build -buildvcs=false -o .build/dev/microagent-firecracker-supervisor ./cmd/microagent-firecracker-supervisor
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -o .build/dev/microagent-guestinit-amd64 ./cmd/microagent-guestinit

      - name: Host doctor
        env:
          MICROAGENT_FIRECRACKER_SUPERVISOR: ${{ github.workspace }}/.build/dev/microagent-firecracker-supervisor
        run: .build/dev/microagent --json doctor

      - name: Run full Linux E2E suite
        run: scripts/dev/microagent-e2e.sh
