name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  linux-go:
    name: Linux Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod

      - name: Test Go
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        run: |
          {
            echo "### Go coverage"
            echo
            echo "\`$(go tool cover -func=coverage.out | tail -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Race test Go
        run: go test -race ./...

      - name: Runtime contract smoke
        run: make smoke-contract

  macos-supervisor:
    name: macOS supervisor checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod

      - name: Test Go
        run: go test ./...

      - name: Cache Apple VF supervisor build
        uses: actions/cache@v6
        with:
          path: supervisors/applevf/.build
          key: applevf-${{ runner.os }}-${{ hashFiles('supervisors/applevf/**/*.swift', 'supervisors/applevf/Package.*') }}
          restore-keys: |
            applevf-${{ runner.os }}-

      - name: Build Apple VF supervisor
        run: swift build --package-path supervisors/applevf --disable-sandbox

      - name: Test Apple VF supervisor
        run: swift test --package-path supervisors/applevf --disable-sandbox

      - name: Smoke Apple VF supervisor lifecycle
        run: scripts/dev/applevf-supervisor-lifecycle-smoke.sh

      - name: Smoke CLI lifecycle
        run: scripts/dev/cli-lifecycle-smoke.sh

      - name: Build signed Apple VF supervisor
        run: scripts/dev/applevf-supervisor-build.sh

      - name: Targeted Apple VF E2E
        run: scripts/dev/microagent-e2e.sh mcp-lifecycle networking-deep public-surface applevf-direct-console applevf-snapshot

  docs-and-scripts:
    name: Docs and shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod

      - name: Check Markdown links
        run: python3 scripts/dev/markdown-link-check.py

      - name: Check docs last-updated stamps
        run: python3 scripts/dev/docs-last-updated.py --check

      - name: Check CLI docs
        run: python3 scripts/dev/cli-docs-check.py

      - name: Check docs parity
        run: python3 scripts/dev/docs-parity.py

      - name: Check docs style
        # Bare invocation defaults to docs/ only, which left every root
        # document (README, MIGRATION, CONTRIBUTING, SECURITY, CHANGELOG)
        # unchecked. Name docs/ and the root files explicitly rather than
        # scanning the repo, so vendored markdown under .cache/ stays out.
        # The sentence-length ceiling applies to docs/ only: CHANGELOG and
        # MIGRATION are records of past releases and keep their wording.
        run: |
          python3 scripts/dev/docs-style.py --max-sentence-words 35 docs
          python3 scripts/dev/docs-style.py ./*.md

      - name: Check changelog fragments
        run: python3 scripts/dev/changelog-fragment-check.py

      - name: Check shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check runtime dependency pins
        run: scripts/dev/check-runtime-dependencies.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Lint workflows
        run: go tool actionlint .github/workflows/*.yaml .github/workflows/*.yml

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod

      - name: Run govulncheck
        run: go tool govulncheck ./...
