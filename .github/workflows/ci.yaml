name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.mod

      - name: Test Go
        run: go test ./...

      - name: Build Apple VF supervisor
        run: swift build --package-path supervisors/applevf --disable-sandbox

      - name: Smoke Apple VF supervisor lifecycle
        run: scripts/dev/applevf-supervisor-lifecycle-smoke.sh

      - name: Smoke CLI lifecycle
        run: scripts/dev/cli-lifecycle-smoke.sh
