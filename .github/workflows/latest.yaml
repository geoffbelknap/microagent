name: latest channel

# Linux latest tracks main. The macOS pin advances only through explicit
# qualification and promotion in update-homebrew-tap.yml.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# If merges land quickly, only the newest bump needs to publish.
concurrency:
  group: microagent-tap-promotion
  cancel-in-progress: false

jobs:
  update-latest-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Same Homebrew GitHub App as update-homebrew-tap.yml. Fails loudly when
      # the app credentials are missing.
      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Set up git
        working-directory: homebrew-tap
        run: |
          git config user.name "microagent-release[bot]"
          git config user.email "microagent-release[bot]@users.noreply.github.com"

      - name: Prepare Linux latest promotion
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          python3 scripts/dev/promote-tap.py \
            --source . --tap homebrew-tap \
            --ref "$CANDIDATE" --platform linux --channel latest

      - name: Publish formula update
        working-directory: homebrew-tap
        run: |
          git add microagent-latest.rb
          if git diff --cached --quiet; then
            echo "Linux latest already uses this candidate."
          else
            git commit -m "microagent: update Linux latest"
            git push
          fi
