name: E2E full

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  matrix:
    name: Generate full scenario matrix
    runs-on: ubuntu-latest
    outputs:
      broad: ${{ steps.gen.outputs.broad }}
      quarantine: ${{ steps.gen.outputs.quarantine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate scenario lists
        id: gen
        run: |
          echo "broad=$(scripts/dev/microagent-e2e.sh --list-tier-platform broad linux | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "quarantine=$(scripts/dev/microagent-e2e.sh --list-tier-platform quarantine linux | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  broad:
    name: Linux KVM broad / ${{ matrix.scenario }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-full-ci'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.matrix.outputs.broad) }}
    env:
      MICROAGENT_E2E_WAIT_TIMEOUT: "180"
      # This job exists to boot real microVMs: a scenario that skips for a
      # missing VM backend must fail the job, not read as suite OK.
      MICROAGENT_E2E_REQUIRE_VM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup microagent KVM environment
        uses: ./.github/actions/setup-microagent-kvm

      - name: Run ${{ matrix.scenario }} (1 retry)
        env:
          SCENARIO: ${{ matrix.scenario }}
          MICROAGENT_E2E_ATTEMPT_DIR: ${{ runner.temp }}/microagent-e2e-attempts
        run: scripts/dev/run-e2e-with-retry.sh "$SCENARIO"

      - name: Upload first-attempt failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-broad-retry-${{ matrix.scenario }}
          path: ${{ runner.temp }}/microagent-e2e-attempts
          if-no-files-found: ignore

  broad-gate:
    name: E2E Linux broad (gate)
    needs: broad
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'run-full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: '[ "${{ needs.broad.result }}" = "success" ] || exit 1'

  quarantine:
    name: Linux KVM quarantine / ${{ matrix.scenario }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name != 'pull_request' || github.event.label.name == 'run-full-ci') && needs.matrix.outputs.quarantine != '[]'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.matrix.outputs.quarantine) }}
    env:
      MICROAGENT_E2E_WAIT_TIMEOUT: "180"
      # Non-blocking lane, but keep skip-vs-pass honest here too.
      MICROAGENT_E2E_REQUIRE_VM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup microagent KVM environment
        uses: ./.github/actions/setup-microagent-kvm

      - name: Run ${{ matrix.scenario }} (1 retry)
        env:
          SCENARIO: ${{ matrix.scenario }}
          MICROAGENT_E2E_ATTEMPT_DIR: ${{ runner.temp }}/microagent-e2e-attempts
        run: scripts/dev/run-e2e-with-retry.sh "$SCENARIO"

      - name: Upload first-attempt failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-quarantine-retry-${{ matrix.scenario }}
          path: ${{ runner.temp }}/microagent-e2e-attempts
          if-no-files-found: ignore
