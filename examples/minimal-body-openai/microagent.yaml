name: minimal-body-openai
image: python:3.13-slim
setup:
  - pip install --no-cache-dir 'pydantic>=2.0,<3' 'openai>=1.50'
  - mkdir -p /app /agent
entrypoint: python /app/body.py
files:
  - src: ./body.py
    dst: /app/body.py
  - src: ./protocol.py
    dst: /app/protocol.py
  - src: ./demo/constraints.json
    dst: /agent/constraints.json
  - src: ./demo/system_prompt.md
    dst: /agent/system_prompt.md
outputs:
  - name: result
    path: /workspace/result.json
