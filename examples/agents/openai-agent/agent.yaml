# Agentfile: an OpenAI Agents SDK agent in an isolated microVM.
#
#   microagent dispatch --file examples/agents/openai-agent/agent.yaml
#
# No image to build: the thin python base is pulled, the SDK is installed at
# boot, agent.py is dropped in, and it runs against a broker endpoint — the
# host injects the real OpenAI key into each request and originates its own
# TLS, so the guest never holds the key and no CA is installed in the guest.
name: openai-agent
image: docker.io/library/python:3.12-slim
setup:
  - run: pip install --no-cache-dir openai-agents
files:
  - src: agent.py
    dst: /app/agent.py
env:
  # A REFERENCE, not a key: the broker swaps @secret:openai for the real
  # value host-side, just before originating its own upstream TLS. Never put
  # a real key here.
  OPENAI_API_KEY: "@secret:openai"
agent:
  entry: python /app/agent.py
  broker:
    upstream: https://api.openai.com
    secret: openai=env:OPENAI_API_KEY
    # Point the SDK at the broker; an empty value fills in the broker URL.
    env: [OPENAI_BASE_URL]
