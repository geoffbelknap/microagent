# Agentfile: a Claude Agent SDK agent in an isolated microVM.
#
#   microagent dispatch --file examples/agents/claude-agent/agent.yaml
#
# No image to build: the thin python base is pulled, the SDK is installed at
# boot, agent.py is dropped in, and it runs against a broker endpoint — the
# host injects the real Anthropic key into each request and originates its own
# TLS, so the guest never holds the key and no CA is installed in the guest.
#
# NOTE: claude-agent-sdk bundles the Claude Code CLI and shells out to it. If your
# environment needs Node.js for the bundled CLI, add it to setup (e.g. a node base
# image, or `apt-get install -y nodejs`). Validate with your key — see README.
name: claude-agent
image: docker.io/library/python:3.12-slim
setup:
  - run: pip install --no-cache-dir claude-agent-sdk
files:
  - src: agent.py
    dst: /app/agent.py
env:
  # A REFERENCE, not a key: the broker swaps @secret:anthropic for the real
  # value host-side, just before originating its own upstream TLS. Never put
  # a real key here.
  ANTHROPIC_API_KEY: "@secret:anthropic"
agent:
  entry: python /app/agent.py
  broker:
    upstream: https://api.anthropic.com
    secret: anthropic=env:ANTHROPIC_API_KEY
    # Point the SDK at the broker; an empty value fills in the broker URL.
    env: [ANTHROPIC_BASE_URL]
