name: quarantined-reader
image: docker.io/library/python:3.12-slim
setup:
  - mkdir -p /app /workspace
entrypoint: python /app/reader.py
files:
  - src: ./reader.py
    dst: /app/reader.py
  - src: ./untrusted.txt
    dst: /workspace/untrusted.txt
outputs:
  - name: extracted
    path: /workspace/extracted.json
