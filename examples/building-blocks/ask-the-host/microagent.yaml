name: ask-the-host
image: docker.io/library/python:3.12-slim
setup:
  - mkdir -p /app /workspace
entrypoint: python /app/agent.py
files:
  - src: ./agent.py
    dst: /app/agent.py
mediation:
  enabled: true
  required: true
  port: 2048
  target: 127.0.0.1:9900
  failClosed: true
outputs:
  - name: result
    path: /workspace/result.json
